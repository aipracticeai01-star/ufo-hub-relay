services:
  - type: web
    name: ufo-hub-relay
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn relay_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: RELAY_API_KEY
        sync: false
      - key: AGENT_TOKEN
        sync: false
      - key: TASK_TIMEOUT_SECONDS
        value: "300"

